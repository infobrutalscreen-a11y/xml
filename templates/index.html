<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Feed Converter</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    label { display:block; margin: 10px 0 6px; font-weight: 600; }
    input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; }
    input[type="file"] { width: 100%; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; cursor: pointer; font-weight: 700; }
    button.primary { background: #2563eb; color: #fff; }
    button.secondary { background: #eee; }
    .row { display:flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1 1 240px; }
    pre { background:#0b1020; color:#e5e7eb; padding: 12px; border-radius: 8px; overflow:auto; }
    .ok { color: #16a34a; font-weight: 700; }
    .err { color: #dc2626; font-weight: 700; }
    .muted { color:#6b7280; }
    .actions { display:flex; gap: 10px; align-items:center; flex-wrap: wrap; margin-top: 14px; }
    a.download { font-weight: 700; }
  </style>
</head>
<body>

  <h2>XML → Конвертер фидов</h2>
  <p class="muted">Загрузка XML, выбор формата, конвертация через API.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="apiKey">API Key (X-API-Key)</label>
        <input id="apiKey" type="text" placeholder="например: supersecretkey123" autocomplete="off" />
      </div>
      <div>
        <label for="format">Формат</label>
        <select id="format">
          <option value="yml">yml</option>
          <option value="avito_auto">avito_auto</option>
        </select>
      </div>
    </div>

    <label for="file">XML файл</label>
    <input id="file" type="file" accept=".xml,text/xml,application/xml" />

    <div class="actions">
      <button class="primary" id="btnConvert">Конвертировать</button>
      <button class="secondary" id="btnHealth">Проверить /health</button>
      <span id="status" class="muted"></span>
    </div>
  </div>

  <div class="card">
    <h3>Результат</h3>
    <div id="resultMeta" class="muted">Пока нет результата.</div>
    <div id="downloadWrap" style="margin-top:10px;"></div>
    <div style="margin-top:12px;">
      <label>Превью (первые строки)</label>
      <pre id="preview">(пусто)</pre>
    </div>
  </div>

<script>
  const apiKeyEl = document.getElementById('apiKey');
  const formatEl = document.getElementById('format');
  const fileEl = document.getElementById('file');
  const statusEl = document.getElementById('status');
  const previewEl = document.getElementById('preview');
  const resultMetaEl = document.getElementById('resultMeta');
  const downloadWrapEl = document.getElementById('downloadWrap');

  const btnConvert = document.getElementById('btnConvert');
  const btnHealth = document.getElementById('btnHealth');

  function setStatus(text, type="muted") {
    statusEl.className = type === "ok" ? "ok" : (type === "err" ? "err" : "muted");
    statusEl.textContent = text;
  }

  function clearResult() {
    previewEl.textContent = "(пусто)";
    resultMetaEl.textContent = "Пока нет результата.";
    downloadWrapEl.innerHTML = "";
  }

  function getFilenameFromDisposition(cd) {
    // content-disposition: attachment; filename="feed.yml"
    if (!cd) return null;
    const m = cd.match(/filename\*?=(?:UTF-8''|")?([^\";]+)\"?/i);
    if (!m) return null;
    try {
      return decodeURIComponent(m[1]);
    } catch {
      return m[1];
    }
  }

  async function doHealth() {
    setStatus("Проверяю /health ...");
    try {
      const r = await fetch('/health');
      const t = await r.text();
      if (!r.ok) throw new Error("HTTP " + r.status + ": " + t);
      setStatus("OK: " + t, "ok");
    } catch (e) {
      setStatus("Ошибка /health: " + e.message, "err");
    }
  }

  async function doConvert() {
    clearResult();

    const apiKey = (apiKeyEl.value || "").trim();
    const format = formatEl.value;
    const file = fileEl.files && fileEl.files[0];

    if (!apiKey) {
      setStatus("Введи API key.", "err");
      return;
    }
    if (!file) {
      setStatus("Выбери XML файл.", "err");
      return;
    }

    setStatus("Отправляю файл на конвертацию...");

    const fd = new FormData();
    fd.append("file", file);

    const url = `/api/v1/convert?format=${encodeURIComponent(format)}`;

    try {
      const r = await fetch(url, {
        method: "POST",
        headers: {
          "X-API-Key": apiKey
        },
        body: fd
      });

      // обработка ошибок
      if (!r.ok) {
        let errText = "";
        try { errText = await r.text(); } catch {}
        if (r.status === 403) {
          throw new Error("403 Forbidden: неверный или отсутствующий API key.");
        }
        if (r.status === 429) {
          throw new Error("429 Too Many Requests: сработал rate limit (nginx). Подожди и попробуй снова.");
        }
        throw new Error(`HTTP ${r.status}: ${errText || "ошибка"}`);
      }

      const contentType = r.headers.get("content-type") || "";
      const cd = r.headers.get("content-disposition") || "";
      const filename = getFilenameFromDisposition(cd) || `feed.${format === "yml" ? "yml" : "xml"}`;

      const blob = await r.blob();

      resultMetaEl.innerHTML = `
        <div><b>Формат:</b> ${format}</div>
        <div><b>Content-Type:</b> ${contentType}</div>
        <div><b>Размер:</b> ${(blob.size/1024).toFixed(1)} KB</div>
      `;

      // download link
      const blobUrl = URL.createObjectURL(blob);
      downloadWrapEl.innerHTML = `
        <a class="download" href="${blobUrl}" download="${filename}">⬇ Скачать результат (${filename})</a>
      `;

      // preview first lines
      const text = await blob.text();
      const lines = text.split(/\r?\n/).slice(0, 40).join("\n");
      previewEl.textContent = lines || "(пусто)";

      setStatus("Готово ✅", "ok");
    } catch (e) {
      setStatus(e.message, "err");
    }
  }

  btnConvert.addEventListener("click", (e) => {
    e.preventDefault();
    doConvert();
  });

  btnHealth.addEventListener("click", (e) => {
    e.preventDefault();
    doHealth();
  });
</script>

</body>
</html>
