<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XML → Конвертер фидов</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f7fb; margin:0; }
    .wrap { max-width: 980px; margin: 28px auto; padding: 0 16px; }
    h1 { margin: 0 0 8px; }
    .muted { color:#667085; margin: 0 0 18px; }
    .card { background:#fff; border:1px solid #eaecf0; border-radius: 14px; padding: 18px; box-shadow: 0 1px 10px rgba(0,0,0,.04); }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { font-weight: 600; display:block; margin-bottom: 6px; }
    input[type="text"], select { width:100%; padding:10px 12px; border:1px solid #d0d5dd; border-radius: 10px; }
    input[type="file"] { width:100%; }
    .row { display:flex; gap:12px; align-items:center; flex-wrap: wrap; margin-top: 14px; }
    button { padding: 10px 14px; border:0; border-radius: 10px; cursor:pointer; font-weight:700; }
    .btn-primary { background:#2563eb; color:#fff; }
    .btn-gray { background:#eef2f6; color:#111827; }
    .badge { font-weight: 700; }
    .ok { color:#16a34a; }
    .err { color:#dc2626; }
    pre { background:#0b1220; color:#e5e7eb; padding: 14px; border-radius: 12px; overflow:auto; }
    .result a { font-weight: 700; }
    .small { font-size: 14px; color:#475467; }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>XML → Конвертер фидов</h1>
    <p class="muted">Загрузка XML, выбор формата, конвертация через API.</p>

    <div class="card">
      <div class="grid">
        <div>
          <label>API Key (X-API-Key)</label>
          <input id="apiKey" type="text" placeholder="вставь ключ" value="supersecretkey123" />
        </div>
        <div>
          <label>Формат</label>
          <select id="format">
            <option value="yml">yml</option>
          </select>
          <div class="small" style="margin-top:6px;">Список подтянется из <code>/api/v1/formats</code></div>
        </div>
      </div>

      <div style="margin-top:14px;">
        <label>XML файл</label>
        <input id="file" type="file" accept=".xml" />
      </div>

      <div class="row">
        <button class="btn-primary" id="btnConvert">Конвертировать</button>
        <button class="btn-gray" id="btnHealth">Проверить /health</button>
        <span id="status" class="badge"></span>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="card result">
      <h2 style="margin-top:0;">Результат</h2>
      <div id="meta" class="small"></div>
      <div id="download" style="margin: 10px 0;"></div>
      <div id="previewTitle" style="display:none; font-weight:700; margin: 10px 0 8px;">Превью (первые строки)</div>
      <pre id="preview" style="display:none;"></pre>
    </div>
  </div>

<script>
  const el = (id) => document.getElementById(id);

  function setStatus(text, ok=true) {
    el("status").textContent = text;
    el("status").className = "badge " + (ok ? "ok" : "err");
  }

  async function apiFetch(url, options={}) {
    const key = el("apiKey").value.trim();
    options.headers = options.headers || {};
    if (key) options.headers["X-API-Key"] = key;
    return fetch(url, options);
  }

  async function loadFormats() {
    try {
      const r = await apiFetch("/api/v1/formats");
      if (!r.ok) {
        // если ключ неверный/пустой — просто не мешаем работать, оставим дефолт
        return;
      }
      const data = await r.json();
      const formats = data.formats || [];
      if (!formats.length) return;

      const sel = el("format");
      sel.innerHTML = "";
      for (const f of formats) {
        const opt = document.createElement("option");
        opt.value = f;
        opt.textContent = f;
        sel.appendChild(opt);
      }
    } catch(e) {}
  }

  el("btnHealth").addEventListener("click", async () => {
    try {
      const r = await fetch("/health");
      if (!r.ok) throw new Error("health not ok");
      setStatus("Готово ✅", true);
    } catch(e) {
      setStatus("Ошибка /health ❌", false);
    }
  });

  el("btnConvert").addEventListener("click", async () => {
    const file = el("file").files[0];
    if (!file) {
      setStatus("Выбери XML файл", false);
      return;
    }

    setStatus("Конвертирую…", true);
    el("meta").textContent = "";
    el("download").innerHTML = "";
    el("preview").style.display = "none";
    el("previewTitle").style.display = "none";

    const fmt = el("format").value;
    const form = new FormData();
    form.append("file", file);

    try {
      const r = await apiFetch(`/api/v1/convert?format=${encodeURIComponent(fmt)}`, {
        method: "POST",
        body: form
      });

      if (!r.ok) {
        const txt = await r.text();
        setStatus(`Ошибка ${r.status}`, false);
        el("meta").textContent = txt;
        return;
      }

      const blob = await r.blob();
      const ct = r.headers.get("content-type") || "";
      const cd = r.headers.get("content-disposition") || "";
      let filename = "result.txt";
      const m = cd.match(/filename="([^"]+)"/);
      if (m) filename = m[1];

      el("meta").innerHTML =
        `Формат: <b>${fmt}</b><br>` +
        `Content-Type: ${ct}<br>` +
        `Размер: ${(blob.size/1024).toFixed(1)} KB`;

      const url = URL.createObjectURL(blob);
      el("download").innerHTML = `⬇ <a href="${url}" download="${filename}">Скачать результат (${filename})</a>`;

      // превью (первые ~80 строк)
      const text = await blob.text();
      const lines = text.split("\n").slice(0, 80).join("\n");
      el("previewTitle").style.display = "block";
      el("preview").style.display = "block";
      el("preview").textContent = lines;

      setStatus("Готово ✅", true);
    } catch(e) {
      setStatus("Ошибка конвертации ❌", false);
      el("meta").textContent = String(e);
    }
  });

  loadFormats();
</script>
</body>
</html>
