<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>XML → YML конвертер</title>
</head>
<body>

<h2>Конвертация XML → YML</h2>

<form action="/api/convert" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept=".xml" required>
    <br><br>
    <button type="submit">Конвертировать</button>
</form>

</body>
</html>
