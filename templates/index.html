<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feed Converter</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0b1220; color:#e8eefc; margin:0; }
    .wrap { max-width: 860px; margin: 40px auto; padding: 0 16px; }
    .card { background:#111a2e; border:1px solid #1f2b4d; border-radius:16px; padding:20px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    h1 { margin:0 0 8px; font-size: 22px; }
    p { margin:0 0 18px; opacity:.9; line-height:1.4; }
    label { display:block; margin: 14px 0 6px; font-size: 13px; opacity:.9; }
    select, input[type="file"] { width: 100%; padding: 10px; border-radius: 10px; border:1px solid #2a3a64; background:#0b1220; color:#e8eefc; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { margin-top: 16px; width:100%; padding: 12px; border:0; border-radius: 12px; background:#2c62ff; color:white; font-weight:700; cursor:pointer; }
    .btn:hover { filter: brightness(1.05); }
    .note { margin-top: 14px; font-size: 12px; opacity: .8; }
    .small { font-size: 12px; opacity:.75; margin-top: 6px; }
    code { background: rgba(255,255,255,.06); padding:2px 6px; border-radius: 6px; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Конвертер фидов</h1>
      <p>Загрузи XML и получи нужный формат. Эта форма работает через <code>/web/convert</code> — ключ не нужен.</p>

      <form action="/web/convert" method="post" enctype="multipart/form-data">
        <div class="row">
          <div>
            <label>Формат результата</label>
            <select name="format">
              <option value="yml">YML</option>
              <option value="avito_auto_new">Avito Auto — NEW</option>
              <option value="avito_auto_used">Avito Auto — USED</option>
              <option value="avito_auto">Avito Auto (общий)</option>
            </select>
            <div class="small">Если добавишь новые форматы — просто допишем сюда option.</div>
          </div>

          <div>
            <label>XML файл</label>
            <input type="file" name="file" accept=".xml" required />
            <div class="small">Максимальный размер зависит от Nginx: сейчас 50MB.</div>
          </div>
        </div>

        <button class="btn" type="submit">Конвертировать</button>
      </form>

      <div class="note">
        Для интеграций есть API: <code>/api/v1/convert</code> (нужен <code>X-API-Key</code>).
      </div>
    </div>
  </div>
</body>
</html>
